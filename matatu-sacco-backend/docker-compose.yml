services:
  postgres:
    image: postgres:16-alpine
    container_name: shuttle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Africa/Nairobi
      PGTZ: Africa/Nairobi
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shuttle-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shuttle-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      TZ: Africa/Nairobi
      # The Dockerfile bakes NODE_ENV=production for real deployments. Locally
      # this image is served over plain http://localhost, where the resulting
      # `Secure` refresh cookie is dropped by the browser — login works, then
      # every page refresh 401s. Override it back to development here.
      NODE_ENV: development
    env_file:
      - .env
    ports:
      - "3000:3000"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: