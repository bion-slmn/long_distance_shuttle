<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Opens the DNS + TCP + TLS handshake to the API in parallel with the JS
         download instead of after it. On a 3G link that handshake is 600-900ms
         that would otherwise be spent idle. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_API_URL%" />

    <!-- Starts the font download immediately rather than after the CSS parses. -->
    <link
      rel="preload"
      href="/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Tab title, and the name a phone uses when the site is pinned to the
         home screen. Without these the tab reads "frontend" and the home-screen
         icon gets the URL. -->
    <title>ShuttleHub</title>
    <meta name="application-name" content="ShuttleHub" />
    <meta name="apple-mobile-web-app-title" content="ShuttleHub" />
    <meta name="description" content="Shuttle and matatu sacco bookings, queues and M-Pesa payments." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
